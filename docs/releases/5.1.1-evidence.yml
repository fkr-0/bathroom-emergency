release_decisions:
  - The unpublished 5.1.0 implementation commit was amended into 5.1.1 before publication, so no public 5.1.0 tag or release boundary exists.
  - Generic emergency surfaces intentionally avoid assuming police involvement; 112 is named only as the EU emergency number.
  - Context-specific German service pages remain allowed to identify German numbers when their purpose and escalation boundary are stated locally.
  - The graph and directory deliberately share one semantic pattern vocabulary so identity survives monochrome printing and cross-view navigation.
  - Repository publication mechanics remain repository documentation rather than reader-facing deployment-site content.
  - The release tag is created only after exact implementation revision build and independent test pass.

known_limits:
  - Build evidence does not establish real-world emergency outcomes, local service availability, clinical outcomes, or deployment quality.
  - Browser and raster checks establish rendering and interaction behavior, not whether a particular emergency service is safe or appropriate in every jurisdiction or personal context.
