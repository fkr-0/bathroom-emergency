release_decisions:
  - BE is a presentation/product mark only; BEG remains the permanent public reference namespace so existing citations do not break.
  - The GitHub repository is a primary header control on both web surfaces rather than only a footer or provenance-row link.
  - Canonical stable fragments fail closed: every active reference must have exactly one target and rendered stable links must resolve within the Pages package.
  - Book-title references terminate at the visible cover title because the redundant source H1 is intentionally removed during standalone assembly.
  - Booklet artifacts that require PDF parser repair are rejected by qpdf before release.
  - The release tag is created only after the exact implementation revision build and independent test pass.

known_limits:
  - Build evidence does not establish real-world emergency outcomes, local service availability, clinical outcomes, or deployment quality.
  - Browser and raster checks establish rendering and interaction behavior, not whether a particular emergency service is safe or appropriate in every jurisdiction or personal context.
  - The versioned evidence record is committed before the authorized push, so push_performed remains false here; remote push and Pages deployment are verified separately after tagging.
