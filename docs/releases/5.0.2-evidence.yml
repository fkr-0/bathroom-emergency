release_decisions:
  - v5.0.2 is the stable release boundary for the accumulated first-stable 5.x booklet, Pages, and running-header work.
  - The compact running header is intentionally shorter than the cover title so A4/2 editions keep one-line identity without trim-edge collisions.
  - The combined print files concatenate already-imposed independent signatures; they are not re-imposed as one corpus.
  - The release tag is created only after the exact implementation revision build and independent test pass.
  - This evidence records the local pre-publication release state; remote push and Pages deployment are verified separately after publication.

known_limits:
  - Build evidence does not establish real-world emergency outcomes, clinical outcomes, local service availability, or deployment quality.
  - Direct agent image viewing of the generated PDF contact sheets was unavailable across the bridge namespace; automated raster, geometry, density, accessibility, and browser checks passed.
